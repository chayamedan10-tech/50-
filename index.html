<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF3E3">
  <title>עוד 50 יום את גרה NOT WITH US</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF3E3;
      --paper: #fffaf0;
      --ink: #23425A;
      --muted: #687986;
      --rose: #B56A6A;
      --rose-dark: #9c5458;
      --gold: #C69C4B;
      --gold-light: #ead7ac;
      --blue: #23425A;
      --line: #d7c59f;
      --shadow: 0 20px 55px rgb(50 42 28 / 20%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(135deg, #d6c5a9, #f1e7d4 43%, #cbb99d);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: -35px;
      background:
        radial-gradient(ellipse at 50% 108%, rgb(92 65 42 / 31%), transparent 38%),
        radial-gradient(ellipse at 4% 37%, rgb(255 249 227 / 75%), transparent 25%),
        radial-gradient(ellipse at 94% 24%, rgb(92 67 43 / 28%), transparent 28%),
        radial-gradient(circle at 12% 12%, #fff1bd 0 3px, rgb(255 231 167 / 58%) 5px, transparent 22px),
        radial-gradient(circle at 28% 22%, #ffe6a1 0 3px, rgb(255 221 143 / 50%) 5px, transparent 19px),
        radial-gradient(circle at 71% 11%, #fff1bd 0 3px, rgb(255 231 167 / 58%) 5px, transparent 23px),
        radial-gradient(circle at 88% 39%, #ffe6a1 0 3px, rgb(255 221 143 / 50%) 5px, transparent 20px),
        radial-gradient(circle at 8% 72%, #fff1bd 0 3px, rgb(255 231 167 / 50%) 5px, transparent 21px),
        radial-gradient(circle at 91% 83%, #fff1bd 0 3px, rgb(255 231 167 / 50%) 5px, transparent 22px),
        linear-gradient(90deg, rgb(87 60 39 / 12%), transparent 20%, transparent 80%, rgb(87 60 39 / 12%));
      content: "";
      filter: blur(7px);
      pointer-events: none;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .hero {
      position: relative;
      width: min(900px, 100%);
      min-height: clamp(290px, 43vw, 420px);
      margin: 0 auto;
      padding: clamp(70px, 10vw, 112px) clamp(27px, 8vw, 90px);
      filter: drop-shadow(0 18px 22px rgb(47 39 27 / 22%));
      text-align: center;
    }

    .plaque-frame, .plaque-flourish {
      position: absolute;
      pointer-events: none;
    }

    .plaque-frame { inset: 0; width: 100%; height: 100%; }
    .plaque-flourish { left: 50%; width: min(42%, 260px); height: 54px; transform: translateX(-50%); }
    .plaque-flourish.top { top: 6%; }
    .plaque-flourish.bottom { bottom: 4%; transform: translateX(-50%) rotate(180deg); }

    .sign-copy {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: center;
      justify-items: center;
      width: 100%;
      height: 100%;
      padding-top: 16px;
    }

    .sign-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: .15em .22em;
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 5.3vw, 3.8rem);
      font-weight: 800;
      line-height: 1.4;
    }

    .sign-line .count-number { font-size: 1.15em; }
    .not-word {
      position: relative;
      display: inline-block;
      color: var(--rose);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
    }

    .not-word::after {
      position: absolute;
      right: 0;
      bottom: .06em;
      left: 0;
      height: 2px;
      background: var(--rose);
      content: "";
    }

    .sign-divider {
      position: relative;
      width: min(76%, 520px);
      height: 1px;
      margin: 9px auto 4px;
      background: var(--gold);
    }

    .sign-divider::before, .sign-divider::after {
      position: absolute;
      top: 50%;
      color: var(--gold);
      content: "✦";
      font-size: 14px;
      transform: translateY(-50%);
    }

    .sign-divider::before { right: -24px; }
    .sign-divider::after { left: -24px; }

    .with-us {
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 4.7rem);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.12;
      text-shadow: 1px 1px 0 #fff8e8, 2px 3px 0 rgb(35 66 90 / 15%);
    }

    .creator-tools {
      width: fit-content;
      max-width: 100%;
      margin: 13px auto 0;
      color: #625a4f;
      font-size: .8rem;
      text-align: center;
    }

    .creator-tools summary {
      cursor: pointer;
      opacity: .63;
    }

    .creator-tools summary:hover, .creator-tools summary:focus-visible { opacity: 1; }

    .creator-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 11px;
      border: 1px solid var(--gold-light);
      border-radius: 12px;
      background: rgb(250 243 227 / 92%);
    }

    .creator-controls input, .creator-controls button {
      min-height: 34px;
      padding: 5px 9px;
      border: 1px solid #c9b783;
      border-radius: 8px;
      background: #fffaf0;
      color: var(--blue);
    }

    .creator-controls button { cursor: pointer; }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 4px 11px;
      color: var(--blue);
      font-size: .94rem;
    }

    .progress-track {
      flex: 1;
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #eadfd7;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), var(--gold));
      transition: width .45s ease;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 31px 2px 15px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      font-weight: 500;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .door-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .door {
      position: relative;
      min-height: 100px;
      padding: 14px 8px;
      border: 1.5px solid var(--blue);
      border-radius: 20px 11px 20px 11px;
      background: var(--cream);
      box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 4px var(--gold), 0 7px 17px rgb(47 39 27 / 12%);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .door:not(:disabled):hover, .door:not(:disabled):focus-visible {
      transform: translateY(-3px);
      border-color: var(--rose);
      box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 4px var(--rose), 0 11px 22px rgb(47 39 27 / 18%);
      outline: none;
    }

    .door.available {
      background: linear-gradient(145deg, #fffaf0, #f3e7cb);
    }

    .door.completed {
      border-color: var(--rose);
      background: linear-gradient(145deg, #fffaf0, #f4e1dc);
    }

    .door:disabled {
      color: #89939a;
      background: #e8e2d5;
      cursor: not-allowed;
      box-shadow: inset 0 0 0 3px #e8e2d5, inset 0 0 0 4px #b6aa91;
    }

    .door-number {
      display: block;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem;
      line-height: 1;
    }

    .door:disabled .door-number { color: #89939a; }

    .door-label {
      display: block;
      margin-top: 8px;
      color: #687986;
      font-size: .76rem;
    }

    .door-mark {
      position: absolute;
      top: 8px;
      left: 9px;
      font-size: .9rem;
    }

    .door.available .door-mark { color: var(--gold); }
    .door.completed .door-mark { color: var(--rose-dark); }

    .week-banner {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 1px;
      padding: 12px 16px;
      border: 1px solid var(--gold);
      border-radius: 15px 9px;
      background: linear-gradient(110deg, #fffaf0, #f3e7cb 50%, #fffaf0);
      box-shadow: inset 0 0 0 3px rgb(250 243 227 / 75%);
      text-align: center;
    }

    .week-banner img {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .week-banner h3 {
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.22rem;
      font-weight: 600;
    }

    .week-banner p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .footer-note {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.7;
      text-align: center;
    }

    .reset-button {
      display: block;
      margin: 16px auto 0;
      padding: 7px 12px;
      border: 0;
      background: transparent;
      color: #5b6d79;
      font-size: .82rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .notice {
      margin: 16px 0 0;
      padding: 12px 15px;
      border: 1px solid #d9a8a8;
      border-radius: 12px;
      background: #fff0ef;
      color: #793f43;
      line-height: 1.6;
    }

    .notice[hidden] { display: none; }

    dialog {
      width: min(620px, calc(100% - 28px));
      max-width: none;
      max-height: min(94vh, 850px);
      padding: 0;
      overflow: auto;
      border: 2px solid var(--blue);
      border-radius: 22px 13px 22px 13px;
      background: var(--cream);
      color: var(--ink);
      box-shadow: inset 0 0 0 4px var(--cream), inset 0 0 0 5px var(--gold), 0 24px 80px rgb(48 32 28 / 38%);
    }

    dialog::backdrop {
      background: rgb(37 42 43 / 48%);
      backdrop-filter: blur(5px);
    }

    .modal-content { padding: clamp(22px, 5vw, 34px); }

    .modal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .day-kicker {
      margin: 0 0 5px;
      color: var(--rose-dark);
      font-weight: 700;
    }

    .modal-title {
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 500;
    }

    .close-button {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--gold-light);
      border-radius: 50%;
      background: var(--paper);
      color: var(--blue);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .flip-card {
      display: block;
      width: min(100%, 470px);
      min-height: clamp(360px, 56vh, 430px);
      margin: 24px auto 0;
      padding: 0;
      border: 0;
      border-radius: 20px 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      perspective: 1300px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .flip-card:focus-visible, .close-button:focus-visible, .reset-button:focus-visible {
      outline: 3px solid rgb(198 156 75 / 44%);
      outline-offset: 3px;
    }

    .flip-card-inner {
      position: relative;
      display: block;
      min-height: clamp(360px, 56vh, 430px);
      transform-style: preserve-3d;
      transition: transform .75s cubic-bezier(.2, .75, .25, 1);
    }

    .flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }

    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 34px);
      overflow: hidden;
      border: 2px solid var(--gold);
      border-radius: 20px 12px;
      background:
        radial-gradient(ellipse at 50% 0, rgb(234 215 172 / 30%), transparent 48%),
        linear-gradient(145deg, #fffaf0, var(--cream) 65%, #f6e8cd);
      box-shadow: inset 0 0 0 4px var(--cream), inset 0 0 0 5px var(--gold-light), 0 14px 32px rgb(47 39 27 / 12%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-front::before, .flip-back::before {
      position: absolute;
      inset: 10px;
      border: 1px solid rgb(198 156 75 / 52%);
      border-radius: 14px 8px;
      content: "";
      pointer-events: none;
    }

    .flip-back { transform: rotateY(180deg); }

    .flip-week-heading {
      display: grid;
      justify-items: center;
      gap: 5px;
      margin-bottom: 13px;
      color: var(--rose-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .flip-week-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .flip-day-number {
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.25rem;
      font-weight: 700;
    }

    .flip-quote {
      margin: 15px 0 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 3.8vw, 1.48rem);
      line-height: 1.8;
    }

    .flip-prompt, .flip-back-prompt {
      position: relative;
      margin-top: auto;
      padding-top: 20px;
      color: var(--rose-dark);
      font-size: .96rem;
      font-weight: 700;
    }

    .flip-status {
      min-height: 1.5em;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    .flip-image {
      display: block;
      width: 100%;
      max-height: 290px;
      object-fit: contain;
    }

    .flip-emoji {
      color: var(--ink);
      font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      font-size: clamp(5rem, 22vw, 8rem);
      line-height: 1.2;
    }

    .flip-placeholder {
      display: grid;
      min-height: 190px;
      place-items: center;
      color: var(--rose-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
    }

    .flip-image[hidden], .flip-emoji[hidden], .flip-placeholder[hidden], .flip-week-icon[hidden] {
      display: none;
    }

    @media (min-width: 720px) {
      .door-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 13px; }
      .door { min-height: 112px; }
    }

    @media (max-width: 430px) {
      .page { width: min(100% - 22px, 1120px); padding-top: 18px; }
      .hero { min-height: 270px; padding: 68px 22px; }
      .sign-line { font-size: clamp(1.5rem, 7vw, 2rem); }
      .with-us { font-size: clamp(2rem, 10vw, 2.8rem); }
      .door-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
      .door { min-height: 88px; border-radius: 14px; }
      .door-number { font-size: 1.45rem; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .progress-wrap { gap: 9px; font-size: .82rem; }
      .flip-card, .flip-card-inner { min-height: clamp(340px, 57vh, 390px); }
      .flip-face { padding: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

        </g>
        <g fill="#23425A"><ellipse cx="35" cy="22" rx="5" ry="12" transform="rotate(-52 35 22)"/><ellipse cx="58" cy="12" rx="5" ry="12" transform="rotate(-38 58 12)"/><ellipse cx="79" cy="15" rx="5" ry="12" transform="rotate(-28 79 15)"/><ellipse cx="218" cy="31" rx="5" ry="12" transform="rotate(55 218 31)"/><ellipse cx="197" cy="41" rx="5" ry="12" transform="rotate(42 197 41)"/></g>
        <g fill="#C69C4B"><circle cx="128" cy="25" r="4"/><path d="M105 17 l3 6 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1Z"/><path d="M150 9 l3 6 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1Z"/></g>
        <g transform="translate(128 19)" fill="#B56A6A"><ellipse cy="-6" rx="5" ry="8"/><ellipse cy="-6" rx="5" ry="8" transform="rotate(72)"/><ellipse cy="-6" rx="5" ry="8" transform="rotate(144)"/><ellipse cy="-6" rx="5" ry="8" transform="rotate(216)"/><ellipse cy="-6" rx="5" ry="8" transform="rotate(288)"/><circle r="3" fill="#C69C4B"/></g>
      </svg>
      <div class="sign-copy">
        <h1 class="sign-line" aria-label="עוד 50 יום את גרה NOT">
          <span>עוד</span>
          <strong class="count-number" id="countdownNumber">50</strong>
          <span>יום את גרה</span>
          <span class="not-word" dir="ltr">NOT</span>
        </h1>
        <div class="sign-divider" aria-hidden="true"></div>
        <p class="with-us" dir="ltr">WITH US</p>
      </div>
    </header>

    <details class="creator-tools">
      <summary>כלי בדיקה ליוצרת</summary>
      <div class="creator-controls" dir="rtl">
        <label for="previewDate">תאריך לתצוגה:</label>
        <input id="previewDate" type="date">
        <button id="previewNextDay" type="button">הצגת היום הבא</button>
        <button id="resetPreview" type="button">חזרה להיום</button>
      </div>
    </details>

    <div id="storageNotice" class="notice" role="alert" hidden></div>

    <section aria-labelledby="progressTitle">
      <div class="progress-wrap">
        <span id="progressTitle">כמה דלתות נפתחו?</span>
        <div class="progress-track" role="progressbar" aria-label="התקדמות המשחק" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <strong id="progressText">0 מתוך 50</strong>
      </div>
    </section>

    <section aria-labelledby="doorsTitle">
      <div class="section-heading">
        <h2 id="doorsTitle">50 דלתות, 50 הפתעות</h2>
        <p>מתחילים מיום 50 וצועדים עד ליום הגדול ✨</p>
      </div>
      <div class="door-grid" id="doorGrid" aria-label="דלתות הימים"></div>
    </section>

    <p class="footer-note" id="footerNote">הדלת הראשונה פתוחה כבר עכשיו. בכל יום נפתחת עוד דלת — בקצב שמתאים למסע, לא בקצב של הדודה ששואלת מתי החתונה.</p>
    <button class="reset-button" id="resetProgress" type="button">להתחיל מחדש ולאפס את ההתקדמות</button>
  </main>

  <dialog id="dayDialog" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-top">
        <div>
          <p class="day-kicker" id="dayKicker"></p>
          <h2 class="modal-title" id="modalTitle"></h2>
        </div>
        <button class="close-button" id="closeDialog" type="button" aria-label="סגירה">×</button>
      </div>
      <button class="flip-card" id="flipCard" type="button" aria-pressed="false">
        <span class="flip-card-inner">
          <span class="flip-face flip-front" id="flipFront" aria-hidden="false">
            <span class="flip-week-heading">
              <img class="flip-week-icon" id="flipWeekIcon" alt="" hidden>
              <span id="flipWeekTitle"></span>
            </span>
            <span class="flip-day-number" id="flipDayNumber"></span>
            <span class="flip-quote" id="flipQuote"></span>
            <span class="flip-prompt">לחצי להפוך את הכרטיס ↻</span>
          </span>
          <span class="flip-face flip-back" id="flipBack" aria-hidden="true">
            <img class="flip-image" id="flipImage" alt="" hidden>
            <span class="flip-emoji" id="flipEmoji" hidden></span>
            <span class="flip-placeholder" id="flipPlaceholder" hidden>♡</span>
            <span class="flip-back-prompt">לחצי להפוך חזרה ↻</span>
          </span>
        </span>
      </button>
      <p class="flip-status" id="flipStatus" role="status" aria-live="polite"></p>
    </div>
  </dialog>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
